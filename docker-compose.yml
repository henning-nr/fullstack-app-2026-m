services:
  db:
    image: postgres:16-alpine
    container_name: petshop-db
    environment:
      POSTGRES_DB: ${DB_NAME:-petshop_db}
      POSTGRES_USER: ${DB_USER:-petshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      petshop-network:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petshop -d petshop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: petshop-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: 172.30.0.10
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-petshop_db}
      DB_USER: ${DB_USER:-petshop}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      petshop-network:
        ipv4_address: 172.30.0.11

  frontend:
    build:
      context: ./frontend
    container_name: petshop-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      petshop-network:
        ipv4_address: 172.30.0.12

volumes:
  postgres_data:

networks:
  petshop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
